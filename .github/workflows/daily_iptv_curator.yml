name: Daily IPTV Scraper, Event Curator & Self-Healing Tester

on:
  schedule:
    # Run every 12 hours (03:00 and 15:00 UTC)
    - cron: '0 3,15 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  curate-and-heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Daily Scraper, Live Tester & Cloud Sync
        env:
          GIST_PAT: ${{ secrets.GIST_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python daily_curator_pipeline.py

      - name: Commit & Push Updated Playlists & EPG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add verified_premier_sports.m3u8 temporary_sports.m3u8 sports_epg.xml || true
          git commit -m "Auto-curate sports streams, event feeds & EPG [skip ci]" || echo "No changes to commit"
          git push || echo "No push needed"
