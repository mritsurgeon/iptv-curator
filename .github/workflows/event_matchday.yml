name: Custom Matchday Event Fast Update

on:
  workflow_dispatch:
    inputs:
      events:
        description: 'Comma-separated matches/events to target'
        required: true
        default: 'Springboks vs Ireland, England vs New Zealand'
        type: string
      sport:
        description: 'Sport category'
        required: false
        default: 'Rugby'
        type: choice
        options:
          - Rugby
          - Football
          - Cricket
          - Tennis
          - Combat Sports
          - Motorsport

concurrency:
  group: iptv-curator-state
  cancel-in-progress: false

jobs:
  matchday-fast-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Restore Durable SQLite State
        run: |
          python3 database/state_sync.py pull --db data/iptv_curator.db --branch state

      - name: Run Fast Event-Targeted Discovery & Verification (~2 min)
        env:
          GIST_PAT: ${{ secrets.GIST_PAT || secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 daily_curator_pipeline.py --event "${{ github.event.inputs.events }}" --sport "${{ github.event.inputs.sport }}"

      - name: Publish Durable SQLite Snapshot
        run: |
          python3 database/state_sync.py push --db data/iptv_curator.db --branch state

      - name: Commit & Push Matchday Playlist & Updated Outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add event_matchday.m3u live_now.m3u upcoming_events.m3u master_sports.m3u rugby.m3u football.m3u cricket.m3u tennis.m3u combat_sports.m3u verified_premier_sports.m3u8 sports_epg.xml channel_catalogue.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Matchday fast update: ${{ github.event.inputs.events }} [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

